<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - IntelliVue</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Poppins', sans-serif;
    }

    body, html {
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      color: white;
      height: 100%;
      overflow-x: hidden;
      position: relative;
      z-index: 1;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #1a1a1a 10%, #000000 90%);
      z-index: -3;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('https://www.transparenttextures.com/patterns/asfalt-light.png');
      opacity: 0.05;
      z-index: -2;
    }

    .particle-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .register-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    
    }
    
    .register-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 25px;
      padding: 3rem;
      max-width: 500px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      transition: all 0.3s ease;
    }

    .register-card:hover {
      border-color: rgba(0, 210, 255, 0.7);
      box-shadow: 0 12px 40px rgba(0, 210, 255, 0.4), 0 0 25px rgba(0, 210, 255, 0.2) inset;
    }

    .register-card h2 {
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
      border-color: rgba(0, 210, 255, 0.6);
    }

    .btn-register {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 50px;
      background: linear-gradient(270deg, #3a7bd5, #00d2ff);
      background-size: 200% 200%;
      border: none;
      color: #fff;
      transition: 0.5s ease;
      box-shadow: 0 5px 15px rgba(0, 210, 255, 0.2);
    }

    .btn-register:hover {
      background-position: right center;
      box-shadow: 0 8px 25px rgba(0, 210, 255, 0.6);
    }

    .text-muted a {
      color: #00d2ff;
      text-decoration: none;
    }

    .text-muted a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <canvas class="particle-bg" id="particles"></canvas>

  <div class="register-container">
    <div class="register-card">
      <h2><i class="fas fa-user-plus me-2"></i>Create Your IntelliVue Account</h2>
      <form id="registerForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
        </div>
        <div class="mb-4">
          <label for="confirm-password" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirm-password" name="confirm_password" placeholder="Re-enter your password" required>
        </div>
        <button type="submit" class="btn btn-register"><i class="fas fa-user-check me-2"></i>Register</button>
        <div class="text-center mt-3">
          Already have an account? <a href="login.html">Login here</a>
        </div>
      </form>
    </div>
  </div>

  <script>
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  window.addEventListener("resize", resize);
  resize();

  const num = 100;
  const particles = [];
  for (let i = 0; i < num; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2 + 1,
      dx: (Math.random() - 0.5) * 0.5,
      dy: (Math.random() - 0.5) * 0.5,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#00d2ff";
    for (let i = 0; i < num; i++) {
      const p = particles[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      p.x += p.dx;
      p.y += p.dy;
      if (p.x < 0 || p.x > w) p.dx *= -1;
      if (p.y < 0 || p.y > h) p.dy *= -1;
    }
    requestAnimationFrame(draw);
  }
  draw();

  // ---------- Registration Form Submission ----------
  const form = document.getElementById('registerForm');

  form.addEventListener('submit', async (e) => {
    e.preventDefault(); // Prevent normal form submit

    const password = form.password.value;
    const confirmPassword = form.confirm_password.value;

    if (password !== confirmPassword) {
      alert("Passwords do not match!");
      return;
    }

    const formData = new FormData();
    formData.append("email", form.email.value);
    formData.append("password", form.password.value);

    try {
      const response = await fetch("http://localhost:8000/signup", {
        method: "POST",
        body: formData
      });

      const result = await response.json();

      if (response.ok && result.status === "success") {
        alert("Signup successful! Redirecting to login...");
        window.location.href = "login.html";
      } else {
        alert("Signup failed: " + (result.message || "Unknown error"));
      }
    } catch (error) {
      alert("Network or server error: " + error.message);
    }
  });
</script>

</body>
</html>
