<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Mock Interview - Dark Theme</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #121212, #1f1f1f);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f1f1f1;
    }
    .container { max-width: 900px; }
    .card {
      border-radius: 20px;
      background: rgba(30, 30, 30, 0.8);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease-in-out;
    }
    .card:hover {
      transform: scale(1.01);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.7);
    }
    .chat-box {
      height: 400px;
      overflow-y: auto;
      padding: 15px;
      border-radius: 10px;
      background: #1e1e1e;
      border: 2px dashed #444;
    }
    .chat-message {
      margin-bottom: 15px;
      padding: 12px 18px;
      border-radius: 20px;
      max-width: 75%;
      word-wrap: break-word;
      font-size: 1rem;
    }
    .user-message {
      background-color: #0d6efd;
      color: white;
      align-self: flex-end;
      text-align: right;
      margin-left: auto;
      border: 2px solid #339af0;
    }
    .bot-message {
      background-color: #343a40;
      color: #f8f9fa;
      align-self: flex-start;
      text-align: left;
      margin-right: auto;
      border: 2px solid #6c757d;
    }
    .feedback-message {
      font-size: 0.9rem;
      color: #20c997;
      margin: -10px 0 10px 10px;
    }
    .input-group input {
      border-radius: 30px 0 0 30px;
      border: 2px solid #6f42c1;
      background-color: #2a2a2a;
      color: #f1f1f1;
    }
    .input-group input:focus {
      box-shadow: 0 0 5px #6f42c1;
      border-color: #6f42c1;
    }
    .input-group button {
      border-radius: 0 30px 30px 0;
      background-color: #6f42c1;
      border: none;
      color: white;
      font-weight: bold;
    }
    .input-group button:hover {
      background-color: #5a32a3;
    }
    label, input, button {
      color: #f1f1f1;
    }
    .form-control:disabled, .form-control[readonly] {
      background-color: #3a3a3a;
      border-color: #555;
    }
    .stop-btn {
      margin-top: 1rem;
      display: none;
    }
    @media (max-width: 576px) {
      .chat-message {
        max-width: 100%;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4 fw-bold text-info"> IntelliVue: AI-Powered Mock Resume-Based Interview Portal</h2>

  <!-- Resume Upload -->
  <div class="card mb-4 p-4">
    <form id="resumeForm">
      <label for="resume" class="form-label">📄 Upload your Resume (PDF only):</label>
      <input type="file" class="form-control" id="resume" name="resume" accept=".pdf" required>
      <input type="email" class="form-control mt-2" id="email" name="email" placeholder="📧 Enter your email (registered)" required>
      <button type="submit" class="btn btn-info mt-3 w-100">🚀 Start Interview</button>
    </form>
  </div>

  <!-- Chat UI -->
  <div class="card p-4">
    <div id="chatBox" class="chat-box d-flex flex-column mb-3"></div>

    <!-- Stop Interview Button -->
    <div class="stop-btn text-center" id="stopButtonSection">
      <button class="btn btn-danger" onclick="stopInterview()">🛑 Stop Interview</button>
    </div>

    <form id="chatForm">
      <div class="input-group" id="chatInput">
        <input type="text" id="userInput" class="form-control" placeholder="💬 Type your answer..." required>
        <button type="submit">Send</button>
      </div>
    </form>
  </div>
</div>

<script>
  const resumeForm = document.getElementById('resumeForm');
  const chatForm = document.getElementById('chatForm');
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const chatInput = document.getElementById('chatInput');
  const stopBtn = document.getElementById('stopButtonSection');
  const emailField = document.getElementById('email');
  let sessionStarted = false;
  let interviewActive = true;

  function addMessage(text, className) {
    const div = document.createElement('div');
    div.classList.add('chat-message', className);
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addFeedback(text) {
    const div = document.createElement('div');
    div.classList.add('feedback-message');
    div.innerHTML = `<strong>Feedback:</strong> ${text}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

 async function stopInterview() {
  const email = emailField.value.trim();
  if (!email) {
    addMessage("⚠ Email is required to end the interview.", "bot-message");
    return;
  }

  try {
    const formData = new FormData();
    formData.append('email', email);

    const res = await fetch('http://127.0.0.1:8000/end-interview', {
      method: 'POST',
      body: formData
    });

    const data = await res.json();
    if (data.message) {
      addMessage(`✅ ${data.message}`, "bot-message");
    } else {
      addMessage(`⚠ Failed to save keywords: ${data.error || "No message from server"}`, "bot-message");
    }
  } catch (error) {
    addMessage("⚠ Error contacting server to end interview.", "bot-message");
    console.error("End interview error:", error);
  }

  // Always show this message regardless of backend outcome
  addMessage("✅ Thank you for using IntelliVue! Your interview has ended.", "bot-message");
  
  // Cleanup UI
  setTimeout(() => {
    interviewActive = false;
    chatInput.style.display = "none";
    stopBtn.style.display = "none";
  }, 5000); // 2-second delay

}
  



  resumeForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    const file = document.getElementById('resume').files[0];
    const email = emailField.value.trim();

    if (!file || !email) {
      addMessage("❌ Resume and email are required.", 'bot-message');
      return;
    }

    const formData = new FormData();
    formData.append('resume', file);
    formData.append('email', email);

    try {
      addMessage("📤 Uploading your resume and generating the first question...", 'bot-message');
      const res = await fetch('http://127.0.0.1:8000/upload-resume', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();
      if (data.question) {
        sessionStarted = true;
        interviewActive = true;
        stopBtn.style.display = "block";
        addMessage("✅ Resume processed!", 'bot-message');
        addMessage(data.question, 'bot-message');
      } else {
        addMessage(`❌ Error: ${data.error || "Unexpected response."}`, 'bot-message');
      }
    } catch (error) {
      addMessage("⚠ Error uploading resume. Check backend.", 'bot-message');
      console.error("Upload error:", error);
    }
  });

  chatForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    if (!sessionStarted || !interviewActive) {
      addMessage("📄 Please upload your resume to begin or interview has ended.", 'bot-message');
      return;
    }

    const message = userInput.value.trim();
    if (!message) return;

    addMessage(message, 'user-message');
    userInput.value = '';

    try {
      const res = await fetch('http://127.0.0.1:8000/submit-answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answer: message })
      });

      const data = await res.json();
      if (data.response) {
        if (data.response.feedback) addFeedback(data.response.feedback);
        addMessage(data.response.question || "🤖 Next Question:", 'bot-message');
      } else {
        addMessage("❌ No response from server. Try again.", 'bot-message');
      }
    } catch (error) {
      addMessage("⚠ Error contacting server.", 'bot-message');
      console.error("Chat error:", error);
    }
  });
</script>
</body>
</html>
